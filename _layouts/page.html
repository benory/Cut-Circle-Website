---
layout: default
---
<article class="content-page">
  <header class="page-header{% if page.hero_image %} page-header--image{% endif %}"{% if page.hero_image %} style="--page-image: url('{{ page.hero_image | relative_url }}'); background-position: {{ page.hero_position | default: 'center' }};"{% endif %}>
    <div class="content-width">
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </div>
  </header>
  <div class="content-width prose">
    {{ content }}
  </div>
</article>
