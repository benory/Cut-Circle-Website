---
layout: default
---
<article class="contact-page">
  <h1 class="screen-reader-text">{{ page.title }}</h1>
  <form class="contact-form content-width" action="mailto:info@cutcircle.org" method="post" enctype="text/plain" data-contact-form>
    <div class="contact-form__field">
      <label for="contact-name">Name</label>
      <input id="contact-name" name="name" type="text" placeholder="Name" autocomplete="name" required>
    </div>
    <div class="contact-form__field">
      <label for="contact-email">Email</label>
      <input id="contact-email" name="email" type="email" placeholder="Email" autocomplete="email" required>
    </div>
    <div class="contact-form__field">
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" placeholder="Message" rows="4" required></textarea>
    </div>
    <button type="submit">Send</button>
    <p class="contact-form__note">Send opens this message in your email application. Nothing is transmitted until you send it there. You can also write directly to <a href="mailto:info@cutcircle.org">info@cutcircle.org</a>.</p>
  </form>
</article>
