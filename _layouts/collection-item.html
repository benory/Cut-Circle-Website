---
layout: default
---
<article class="content-page collection-item">
  <header class="page-header{% if page.image %} page-header--image{% endif %}"{% if page.image %} style="--page-image: url('{{ page.image | relative_url }}')"{% endif %}>
    <div class="content-width">
      {% if page.section %}<p class="eyebrow">{{ page.section }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </div>
  </header>
  <div class="content-width prose">
    {{ content }}
  </div>
</article>
