<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="Cut Circle home">
      <img src="{{ '/assets/images/cut-circle-logo-white.png' | relative_url }}" alt="Cut Circle">
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
      <span class="nav-toggle__line"></span>
      <span class="nav-toggle__line"></span>
      <span class="nav-toggle__line"></span>
      <span class="screen-reader-text">Menu</span>
    </button>

    <nav id="primary-navigation" class="primary-nav" aria-label="Primary navigation">
      <ul class="primary-nav__list">
        {% for item in site.data.navigation %}
          {% unless item.label == 'Subscribe' %}
            <li class="primary-nav__item{% if item.children %} has-submenu{% endif %}{% if item.narrow_only %} primary-nav__item--narrow-only{% endif %}">
              <a href="{% if item.external %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if item.external and item.new_window != false %} target="_blank" rel="noopener"{% endif %}>{{ item.label }}</a>
              {% if item.children %}
                <button class="submenu-toggle" type="button" aria-expanded="false" aria-label="Show {{ item.label }} menu">
                  <svg viewBox="0 0 12 8" aria-hidden="true"><path d="m1 1 5 5 5-5"/></svg>
                </button>
                <ul class="submenu">
                  {% for child in item.children %}
                    <li><a href="{{ child.url | relative_url }}">{{ child.label }}</a></li>
                  {% endfor %}
                </ul>
              {% endif %}
            </li>
          {% endunless %}
        {% endfor %}
      </ul>
    </nav>

    <div class="header-actions">
      <a class="search-link" href="{{ '/search/' | relative_url }}" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
      </a>
      <button class="header-subscribe" type="button" data-subscribe-open aria-haspopup="dialog" aria-controls="subscribe-modal">Subscribe</button>
      <a class="donate-button" href="https://www.paypal.com/donate/?hosted_button_id=ETC6XSS6YJEWU" target="_blank" rel="noopener">Donate</a>
    </div>
  </div>
</header>
